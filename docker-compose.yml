services:
  open-brain-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open_brain_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brain_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - brain_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'vector'\" | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  open-brain-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: open_brain_mcp
    env_file: .env
    environment:
      POSTGRES_HOST: open-brain-db
    depends_on:
      open-brain-db:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8000}:8000"
    restart: always
    networks:
      - brain_net

  open-brain-telegram:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: open_brain_telegram
    env_file: .env
    environment:
      POSTGRES_HOST: open-brain-db
    depends_on:
      open-brain-db:
        condition: service_healthy
    restart: always
    networks:
      - brain_net

  crm-api:
    build:
      context: .
      dockerfile: crm_api/Dockerfile
    container_name: open_brain_crm_api
    env_file: .env
    environment:
      POSTGRES_HOST: open-brain-db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      open-brain-db:
        condition: service_healthy
    ports:
      - "8002:8000"
    restart: always
    networks:
      - brain_net

  crm-ui:
    build:
      context: .
      dockerfile: crm_ui/Dockerfile
    container_name: open_brain_crm_ui
    environment:
      API_URL: http://crm-api:8000
    depends_on:
      crm-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: always
    networks:
      - brain_net

networks:
  brain_net:
    driver: bridge

volumes:
  brain_data:
    name: open_brain_data
